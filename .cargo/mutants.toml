# cargo-mutants configuration.
#
# datasets.rs and modules are network and IO glue whose tests are #[ignore]d and gated on
# downloading PubChem, ZINC20, and other corpora, so they cannot be mutation tested in a
# normal `cargo test` run. Excluding it keeps the gate fair: a pull request that
# edits datasets.rs is not asked to kill mutants no offline test could ever
# catch.
exclude_globs = [
    "src/datasets.rs",
    "src/datasets/**/*.rs",
]

# The aromatic-bracket filter in stored_radical_electrons only skips a kekulization that cannot change
# any count, since every atom the kekulizer can give a double bond already has a nonzero direct count.
exclude_re = [
    "replace && with \\|\\| in stored_radical_electrons",
    # Reference atoms differ from their double-bond endpoint.
    "replace > with >= in Smiles<AtomPolicy>::projected_directional_bond_overrides_with_classes$",
    "replace > with >= in Smiles<AtomPolicy>::atom_based_double_bond_normalization$",
    # Distinct bond endpoints have distinct traversal indices.
    "replace < with <= in directional_override_rows_from_parity_constraints$",
    # Bond emission traverses distinct endpoints.
    "replace > with >= in normalized_bond_for_emit$",
    # This helper checks invariants in tests and fuzzing.
    "replace assert_core_rewrite_invariants with \\(\\)$",
    # Without a WL tie the planner's classes fix the whole plan, so the symmetric path renders the same text.
    "replace PlanningClasses::has_ties -> bool with true$",
    # The input numbering's primary plan is an automorphic image of the canonical render and needs as many labels,
    # so only its strictly smaller parser-order fallback can replace that render.
    "replace > with >= in symmetric_render$",
    "replace < with <= in symmetric_render$",
    # Swapping the root's flag with every other atom's still individualizes the root alone.
    "replace != with == in Smiles<AtomPolicy>::symmetric_stereo_labeling$",
    # Without generators or stereo points the smallest image is the identity, so the early return only saves work.
    "replace \\|\\| with && in Smiles<AtomPolicy>::symmetric_stereo_labeling$",
    # The bond matrix has no diagonal, and an automorphism maps distinct atoms to distinct atoms.
    "replace < with <= in Smiles<AtomPolicy>::numbering_relative_stereo$",
    "replace > with >= in Smiles<AtomPolicy>::stereo_smallest_image_automorphism$",
    # Reading every raw direction bit the other way round relabels the points consistently, and any consistent
    # encoding gives a renumbering-invariant render.
    "replace == with != in Smiles<AtomPolicy>::stereo_smallest_image_automorphism$",
    # The sequences hold distinct neighbors.
    "replace > with >= in odd_inversions$",
]