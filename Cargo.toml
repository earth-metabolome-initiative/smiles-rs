[package]
name = "smiles-rs"
version = "0.1.4"
edition = "2024"
rust-version = "1.92"
authors = ["Earth Metabolome Initiative"]
license = "MIT"
repository = "https://github.com/earth-metabolome-initiative/smiles-rs"
description = "A SMILES parser producing molecular graphs, with no_std support"
documentation = "https://docs.rs/smiles-rs"
keywords = ["smiles", "chemistry", "cheminformatics", "parser", "molecule"]
categories = ["science", "parser-implementations", "no-std"]
exclude = [".github/", ".cargo/", "fuzz/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
fuzzing = []
datasets = [
    "dep:flate2",
    "dep:indicatif",
    "dep:reqwest",
    "dep:tar",
    "dep:dirs",
    "dep:zip",
    "dep:csv",
]

[dependencies]
csv = {version = "1.4.0", optional = true}
dirs = {version = "7.0.0", optional = true}
elements_rs = "0.2.7"
flate2 = { version = "1.1.9", optional = true, default-features = false, features = ["rust_backend"] }
geometric-traits = { version = "0.1.0", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.17.0", default-features = false, features = ["default-hasher", "inline-more"] }
indicatif = { version = "0.18.4", optional = true }
molecular-formulas = { version = "0.1.10", default-features = false }
reqwest = { version = "0.13.3", optional = true, default-features = false, features = ["blocking", "rustls"] }
smallvec = { version = "1.15.1", default-features = false, features = ["union"] }
tar = { version = "0.4.45", optional = true }
thiserror = { version = "2.0.18", default-features = false }
zip = { version = "8.6.0", optional = true, default-features = false, features = [
    "deflate-flate2",
] }


[lints.rust]
unsafe_code = "forbid"
missing_docs = "forbid"
unused_macro_rules = "forbid"
unconditional_recursion = "forbid"
unreachable_patterns = "forbid"
unused_import_braces = "forbid"
unused_must_use = "forbid"
deprecated = "deny"

[lints.rustdoc]
broken_intra_doc_links = "forbid"
bare_urls = "forbid"
invalid_codeblock_attributes = "forbid"
invalid_html_tags = "forbid"
missing_crate_level_docs = "forbid"
unescaped_backticks = "forbid"
redundant_explicit_links = "forbid"
invalid_rust_codeblocks = "forbid"

[lints.clippy]
unreadable_literal = "allow"
missing_panics_doc = "allow"
new_ret_no_self = "allow"
should_panic_without_expect = "allow"
doc_markdown = "allow"
clone_on_copy = "forbid"
pedantic = { level = "deny", priority = -1 }


[profile.release]
lto = "thin"
codegen-units = 1

# Optimize dependencies in dev and test builds so the graph algorithms (notably
# the NP-hard MCES from geometric-traits) do not run unoptimized. This cuts the
# unit-test suite from about 18s to about 6s while leaving this crate at the
# default opt-level 0, so per-mutant rebuilds under cargo-mutants stay fast.
# Optimizing this crate too would drop tests to under 1s but make every
# incremental rebuild far slower, which is a net loss for the build-bound
# mutation workflow. The dependency build is a one-time, cacheable cost.
[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1.1.9"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.27.0"

[[bench]]
name = "explicit_hydrogens"
harness = false
