name: Mutation Testing

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mutants:
    name: cargo-mutants (PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - name: Cache build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2.87.14
        with:
          tool: cargo-mutants
      - name: Compute diff against base branch
        run: git diff origin/${{ github.base_ref }} > pr.diff
      - name: Run cargo-mutants on changed lines
        run: cargo mutants --no-shuffle -vV --in-diff pr.diff
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants.out
          path: mutants.out
